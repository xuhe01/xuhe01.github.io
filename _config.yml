# ============================================================
# GitHub Pages + Jekyll 博客配置（自定义界面版）
# 修改本文件后需要重启 `bundle exec jekyll serve` 才会生效
# ============================================================

# ---------- 站点基本信息 ----------
title: 我的博客
description: 记录技术、思考与生活的地方。
author: xuhe
email: 13508471072@163.com
lang: zh-CN

# 站点地址
url: "https://xuhe01.github.io"
baseurl: ""

# ---------- 顶部导航（按需增删） ----------
nav:
  - { name: "首页", url: "/" }
  - { name: "分类", url: "/categories/" }
  - { name: "标签", url: "/tags/" }
  - { name: "归档", url: "/archive/" }
  - { name: "关于", url: "/about/" }

# ---------- 插件（GitHub Pages 白名单内） ----------
plugins:
  - jekyll-feed          # 生成 /feed.xml RSS
  - jekyll-seo-tag       # 自动生成 SEO meta 标签
  - jekyll-sitemap       # 生成 /sitemap.xml

# ---------- 文章设置 ----------
permalink: /:year/:month/:day/:title/
excerpt_separator: "<!--more-->"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# ---------- Markdown / 代码高亮 ----------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true          # 自动为标题生成锚点 id（侧栏目录依赖它）

# ---------- 构建时忽略的文件 ----------
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DEPLOY.md
  - deploy.sh
  - vendor/
  - node_modules/
  - .sass-cache/
